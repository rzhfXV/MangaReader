espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activityKtx = "1.8.0"
constraintlayout = "2.1.4"

# Tambahan Versi DexReader
navigation = "2.7.7"
retrofit = "2.9.0"
okhttp = "4.11.0"
room = "2.6.1"
glide = "4.16.0"

google-services = "4.4.2"
